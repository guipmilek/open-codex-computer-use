name: windows-pr

on:
  pull_request:
    paths:
      - "apps/OpenComputerUseWindows/**"
      - ".github/workflows/windows-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    name: Go ${{ matrix.go-version }} / Windows amd64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.22.x"
          - "1.26.x"

    defaults:
      run:
        working-directory: apps/OpenComputerUseWindows

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: ${{ matrix.go-version }}

      - name: Show Go environment
        run: |
          go version
          go env GOOS GOARCH

      - name: Compile all tests without desktop integration execution
        run: go test -run '^$' ./...

      - name: Run deterministic Windows audit tests
        run: go test -v -run '^(TestWin32ABIPACKING|TestNoPhysicalMouseInputAPICalls|TestOverlayClickThroughStyle)$' ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  win32-integration:
    name: Win32 / ${{ matrix.test }}
    runs-on: windows-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestMonitorFromPointIntegration
          - TestWindowFromPointIntegration
          - TestLockedPlatformWindowIDAtPointOverlappingGeometry
          - TestLockedThreeWindowZOrderIntegration
          - TestLockedCandidateScoringWithVisibleOverlayOverNormalTarget
          - TestLockedCandidateScoringWithVisibleOverlayOverTopmostTarget
          - TestLockedOverlayTransitionTopmostToNormalTarget
          - TestInstrumentedSynchronousCommitGate
          - TestForegroundWindowStability

    defaults:
      run:
        working-directory: apps/OpenComputerUseWindows

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go 1.26
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26.x"

      - name: Run isolated Win32 integration test
        shell: pwsh
        run: go test -v -count=1 -timeout 45s -run "^${{ matrix.test }}$" ./...

  build-windows-arm64:
    name: Windows arm64 cross-build
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/OpenComputerUseWindows

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go 1.26
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26.x"

      - name: Cross-build Windows arm64
        env:
          GOOS: windows
          GOARCH: arm64
        run: go build ./...
